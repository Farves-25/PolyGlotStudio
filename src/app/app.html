<div class="min-h-screen bg-slate-100/70 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex selection:bg-indigo-500/20 selection:text-indigo-700 dark:selection:text-indigo-200 transition-colors">
  
  <!-- LEFT SIDEBAR NAVIGATION -->
  <app-sidebar class="hidden lg:flex"></app-sidebar>

  <!-- MAIN APPLICATION SHELL -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
    
    <!-- TOP HEADER -->
    <app-header
      (onOpenSpotlight)="openSpotlight()"
      (onOpenSupabase)="openSupabase()"
    ></app-header>

    <!-- ACTIVE ROUTE PAGE OUTLET -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>

    <!-- STUDIO FOOTER -->
    <footer class="border-t border-slate-200 dark:border-zinc-800/80 py-5 px-6 text-center text-xs text-slate-500 dark:text-zinc-500 flex flex-col sm:flex-row items-center justify-between gap-3 bg-white/60 dark:bg-zinc-950/60 backdrop-blur-sm transition-colors">
      <div>
        PolyglotStudio • Advanced Multi-Language Acquisition Operating System
      </div>
      <div class="font-mono text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-3">
        <span>Angular 19+ Signals</span>
        <span>•</span>
        <span>Web Audio Analyser</span>
        <span>•</span>
        <span>SuperMemo SM-2</span>
        <span>•</span>
        <span>Supabase Postgres</span>
      </div>
    </footer>
  </div>

  <!-- COMMAND PALETTE SPOTLIGHT MODAL (Ctrl + K) -->
  <app-command-palette
    *ngIf="showSpotlight()"
    (close)="closeSpotlight()"
  ></app-command-palette>

  <!-- SUPABASE CONFIGURATION MODAL -->
  <app-supabase-config-modal
    *ngIf="showSupabaseModal()"
    (close)="closeSupabase()"
  ></app-supabase-config-modal>

  <!-- GLOBAL TOAST NOTIFICATION DRAWER -->
  <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none">
    <div
      *ngFor="let toast of toastService.toasts()"
      class="pointer-events-auto p-4 rounded-2xl border shadow-2xl backdrop-blur-xl flex items-center justify-between gap-3 animate-bounce-subtle"
      [ngClass]="{
        'bg-emerald-950/90 border-emerald-500/40 text-emerald-200': toast.type === 'success',
        'bg-rose-950/90 border-rose-500/40 text-rose-200': toast.type === 'error',
        'bg-amber-950/90 border-amber-500/40 text-amber-200': toast.type === 'warning',
        'bg-slate-900/90 border-indigo-500/40 text-indigo-200': toast.type === 'info'
      }"
    >
      <div class="flex items-center gap-2.5">
        <span class="text-base">
          {{ toast.type === 'success' ? '✓' : toast.type === 'error' ? '✕' : toast.type === 'warning' ? '⚠️' : 'ℹ️' }}
        </span>
        <span class="text-xs font-medium leading-relaxed">{{ toast.message }}</span>
      </div>
      <button
        (click)="toastService.dismiss(toast.id)"
        class="text-xs opacity-60 hover:opacity-100 px-1 py-0.5"
      >
        ✕
      </button>
    </div>
  </div>

</div>
