<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PolyglotStudio — Speak the World, One Sunny Phrase at a Time</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="A joyful, game-like language studio. Learn practical phrases with native audio, playful scenarios, and a memory engine that actually sticks.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var stored = localStorage.getItem('POLYGLOT_THEME');
        var isDark = stored === 'dark';
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.classList.toggle('light', !isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) { /* no-op */ }
    })();
  </script>
</head>
<body class="antialiased">
  <app-root></app-root>
</body>
</html>
