<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pg_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pg_sun" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="pg_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#pg_bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#818CF8" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Sun Rays (8 radiant accents) -->
  <g stroke="url(#pg_sun)" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="11" x2="32" y2="16"/>
    <line x1="32" y1="48" x2="32" y2="53"/>
    <line x1="11" y1="32" x2="16" y2="32"/>
    <line x1="48" y1="32" x2="53" y2="32"/>
    <line x1="17.2" y1="17.2" x2="20.7" y2="20.7"/>
    <line x1="43.3" y1="43.3" x2="46.8" y2="46.8"/>
    <line x1="46.8" y1="17.2" x2="43.3" y2="20.7"/>
    <line x1="20.7" y1="43.3" x2="17.2" y2="46.8"/>
  </g>

  <!-- Central Radiant Sun Disc -->
  <circle cx="32" cy="32" r="11" fill="url(#pg_sun)" filter="url(#pg_glow)"/>

  <!-- Cheerful Mascot Face -->
  <circle cx="28" cy="30" r="1.4" fill="#1E1B4B"/>
  <circle cx="36" cy="30" r="1.4" fill="#1E1B4B"/>
  <path d="M28.5 34.5C29.6 36.5 34.4 36.5 35.5 34.5" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sparkle badge accent -->
  <circle cx="50" cy="14" r="3.5" fill="#F43F5E"/>
  <circle cx="50" cy="14" r="1.5" fill="#FFFFFF"/>
</svg>
